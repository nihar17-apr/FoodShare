<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Portal | Food To Need</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .form-container {
            max-width: 600px;
            margin: 2rem auto;
        }

        .nav-brand {
            cursor: pointer;
        }

        #msg {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 14px;
            text-align: center;
            display: none;
        }

        .success {
            background: oklch(70% 0.15 150 / 0.2);
            color: oklch(85% 0.1 150);
            border: 1px solid oklch(70% 0.15 150 / 0.3);
        }

        .error {
            background: oklch(60% 0.15 20 / 0.2);
            color: oklch(80% 0.1 20);
            border: 1px solid oklch(60% 0.15 20 / 0.3);
        }
    </style>
</head>

<body>
    <div class="aurora-bg"></div>
    <nav class="navbar">
        <div class="nav-brand" onclick="location.href='index.html'">Food To Need</div>
        <div class="nav-links"><a href="index.html" class="nav-link">Home</a></div>
    </nav>

    <main class="container">
        <div class="glass-card form-container" data-reveal>
            <div style="text-align: center; margin-bottom: 2rem">
                <h2 class="gradient-text" style="font-size: 2rem">🚚 Delivery Portal</h2>
                <p style="color: var(--text-dim)">Join our volunteer network to transport food safely.</p>
            </div>

            <form id="deliveryForm" onsubmit="submitDelivery(event)">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="grid-cols-2">
                    <div class="form-group">
                        <label>Contact Email *</label>
                        <input type="email" id="email" required placeholder="john@email.com">
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" id="phone" required placeholder="+91 98765 00000">
                    </div>
                </div>
                <div class="form-group">
                    <label>Preferred Area *</label>
                    <input type="text" id="location" required placeholder="e.g. Kondapur, Hyderabad">
                </div>
                <div class="form-group">
                    <label>Vehicle Type *</label>
                    <select id="vehicleType" required>
                        <option value="Bike">Two Wheeler</option>
                        <option value="Car">Four Wheeler</option>
                        <option value="Van">Delivery Van</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem">Register
                    Now</button>
            </form>
            <div id="msg"></div>
        </div>
    </main>

    <script>
        async function submitDelivery(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = "Processing...";

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                location: document.getElementById('location').value,
                vehicleType: document.getElementById('vehicleType').value
            };

            try {
                const res = await fetch('/add-delivery', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    document.getElementById('msg').textContent = "✅ Applied successfully! Admin will contact you.";
                    document.getElementById('msg').className = "success";
                    document.getElementById('msg').style.display = "block";
                    e.target.reset();
                }
            } catch (err) {
                document.getElementById('msg').textContent = "❌ Error: " + err.message;
                document.getElementById('msg').className = "error";
                document.getElementById('msg').style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Register Now";
            }
        }
        document.querySelectorAll('[data-reveal]').forEach(el => {
            el.style.opacity = '1';
            el.style.transform = 'translateY(0)';
        });
    </script>
</body>

</html>
