<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Portal | Food To Need</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .form-container {
      max-width: 600px;
      margin: 2rem auto;
    }

    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .location-wrapper {
      display: flex;
      gap: 0.5rem;
    }

    .location-wrapper input {
      flex: 1;
    }

    .loc-btn {
      width: 50px;
      padding: 0;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      cursor: pointer;
      transition: var(--transition-fast);
      font-size: 1.2rem;
    }

    .loc-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #msg {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 14px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .success {
      background: oklch(70% 0.15 150 / 0.2);
      color: oklch(85% 0.1 150);
      border: 1px solid oklch(70% 0.15 150 / 0.3);
    }

    .error {
      background: oklch(60% 0.15 20 / 0.2);
      color: oklch(80% 0.1 20);
      border: 1px solid oklch(60% 0.15 20 / 0.3);
    }
  </style>
</head>

<body>
  <div class="aurora-bg"></div>

  <nav class="navbar">
    <div class="nav-brand" onclick="location.href='index.html'" style="cursor: pointer">Food To Need</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
    </div>
  </nav>

  <main class="container">
    <div class="glass-card form-container" data-reveal>
      <div class="form-header">
        <h2 class="gradient-text" style="font-size: 2rem">🏨 Restaurant Portal</h2>
        <p style="color: var(--text-dim)">Register your surplus food items below</p>
      </div>

      <form id="restaurantForm" onsubmit="submitRestaurant(event)">
        <div class="form-group">
          <label for="name">Restaurant Name *</label>
          <input id="name" type="text" placeholder="e.g. The Grand Kitchen" required>
        </div>

        <div class="grid-cols-2">
          <div class="form-group">
            <label for="email">Contact Email *</label>
            <input id="email" type="email" placeholder="contact@restaurant.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input id="phone" type="tel" placeholder="+91 98765 43210" required>
          </div>
        </div>

        <div class="form-group">
          <label for="location">Location *</label>
          <div class="location-wrapper">
            <input id="location" type="text" placeholder="Street address or coordinates" required>
            <button type="button" class="loc-btn" onclick="getLocation()" title="Get Current Location">📍</button>
          </div>
        </div>

        <div class="grid-cols-2">
          <div class="form-group">
            <label for="food">Food Item *</label>
            <input id="food" type="text" placeholder="e.g. Mixed Veg Biryani" required>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="Veg">Vegetarian</option>
              <option value="Non-Veg">Non-Vegetarian</option>
              <option value="Desserts">Desserts</option>
              <option value="Bakery">Bakery</option>
            </select>
          </div>
        </div>

        <div class="grid-cols-2">
          <div class="form-group">
            <label for="quantity">Quantity (Portions) *</label>
            <input id="quantity" type="number" min="1" required>
          </div>
          <div class="form-group">
            <label for="expiryHours">Freshness (Hours) *</label>
            <input id="expiryHours" type="number" min="1" max="48" value="6" required>
          </div>
        </div>

        <div class="form-group">
          <label for="membership">Membership Plan</label>
          <select id="membership">
            <option value="Basic">Basic (Free)</option>
            <option value="Silver">Silver (Pro)</option>
            <option value="Gold">Gold (Elite)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem">Submit Donation</button>
      </form>

      <div id="msg"></div>
    </div>
  </main>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('revealed');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('[data-reveal]').forEach(el => observer.observe(el));

    async function getLocation() {
      const locInput = document.getElementById("location");
      locInput.value = "📍 Locating...";

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
          const data = await res.json();
          locInput.value = data.display_name || `${latitude}, ${longitude}`;
        } catch (e) {
          locInput.value = `${latitude}, ${longitude}`;
        }
      }, () => {
        locInput.value = "";
        alert("Location access denied.");
      });
    }

    function showMessage(text, type) {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.className = type;
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", 5000);
    }

    async function submitRestaurant(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = "Processing...";

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        location: document.getElementById("location").value,
        food: document.getElementById("food").value,
        category: document.getElementById("category").value,
        quantity: document.getElementById("quantity").value,
        expiryHours: document.getElementById("expiryHours").value,
        membership: document.getElementById("membership").value
      };

      try {
        const res = await fetch("/add-restaurant", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          showMessage("✅ Donation listed successfully!", "success");
          e.target.reset();
        } else throw new Error("Server error");
      } catch (err) {
        showMessage("❌ Error: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit Donation";
      }
    }
  </script>
</body>

</html>
