<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal | Food To Need</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .tab-nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .panel {
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .panel.active {
      display: block;
    }

    #map {
      height: 400px;
      border-radius: 20px;
      margin-bottom: 2rem;
      border: 1px solid var(--glass-border);
    }

    .restaurant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .food-tag {
      background: oklch(85% 0.2 150 / 0.1);
      color: var(--accent-glow);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-badge {
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body>
  <div class="aurora-bg"></div>

  <nav class="navbar">
    <div class="nav-brand" onclick="location.href='index.html'" style="cursor: pointer">Food To Need</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
    </div>
  </nav>

  <main class="container">
    <div class="tab-nav">
      <button class="btn btn-primary" onclick="switchTab('browse')">🔍 Browse Food</button>
      <button class="btn glass-card" onclick="switchTab('register')">📋 Register NGO</button>
    </div>

    <!-- Browse Panel -->
    <section id="browsePanel" class="panel active">
      <div class="glass-card" style="margin-bottom: 2rem">
        <h2 class="gradient-text">Available Food Near You</h2>
        <p style="color: var(--text-dim)">Discover real-time food donations from nearby restaurants.</p>
        <div id="map"></div>
      </div>

      <div id="restaurantsList" class="restaurant-grid">
        <!-- Dynamic Content -->
        <div class="loading-msg">Fetching nearby donors...</div>
      </div>
    </section>

    <!-- Register Panel -->
    <section id="registerPanel" class="panel">
      <div class="glass-card" style="max-width: 600px; margin: 0 auto">
        <h2 class="gradient-text">NGO / Receiver Registration</h2>
        <form id="acceptorForm" onsubmit="submitAcceptor(event)">
          <div class="form-group">
            <label>Organization Name *</label>
            <input type="text" id="accName" required placeholder="e.g. Hope Orphanage">
          </div>
          <div class="form-group">
            <label>Contact Email *</label>
            <input type="email" id="accEmail" required placeholder="contact@org.org">
          </div>
          <div class="form-group">
            <label>Location *</label>
            <input type="text" id="accLoc" required placeholder="Full street address">
          </div>
          <div class="form-group">
            <label>Daily Needs</label>
            <textarea id="accNeeds" placeholder="e.g. Needs Approx 50 portions daily"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%">Register Organization</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    let map, markers = [];

    function switchTab(tab) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      if (tab === 'browse') {
        document.getElementById('browsePanel').classList.add('active');
        setTimeout(() => map.invalidateSize(), 100);
      } else {
        document.getElementById('registerPanel').classList.add('active');
      }
    }

    // Initialize Map
    function initMap() {
      map = L.map('map').setView([17.3850, 78.4867], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        map.setView([latitude, longitude], 14);
        L.marker([latitude, longitude]).addTo(map).bindPopup("<b>You are here</b>").openPopup();
        fetchDonors();
      });
    }

    async function fetchDonors() {
      try {
        const res = await fetch('/restaurants');
        const data = await res.json();
        renderDonors(data);
      } catch (err) {
        console.error("Error fetching donors:", err);
      }
    }

    function renderDonors(donors) {
      const list = document.getElementById('restaurantsList');
      if (!donors.length) {
        list.innerHTML = '<div class="glass-card">No verified donors available at the moment.</div>';
        return;
      }

      list.innerHTML = donors.map(d => `
            <div class="glass-card" data-reveal>
                <span class="status-badge">${d.membership} Partner</span>
                <h3 class="gradient-text">${d.name}</h3>
                <p style="font-size: 0.9rem; margin-bottom: 1rem">${d.location}</p>
                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
                    ${d.items.map(i => `
                        <div class="glass-card" style="padding: 0.5rem; font-size: 0.8rem">
                            <div style="font-weight: 800">${i.food}</div>
                            <div style="opacity: 0.7">${i.quantity} portions</div>
                        </div>
                    `).join('')}
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.6rem" onclick="requestFood('${d._id}')">Request Pick-up</button>
            </div>
        `).join('');

      // Add markers to map (simplified)
      donors.forEach(d => {
        // Assume location string might have coords or just address
        // In a real app we'd geocode or use stored lat/lng
      });
    }

    async function submitAcceptor(e) {
      e.preventDefault();
      // ... implementation same as restaurant
    }

    function requestFood(id) {
      alert("Request sent to delivery network!");
    }

    window.onload = initMap;
  </script>
</body>

</html>
