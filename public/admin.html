<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Food To Need</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-val {
      font-size: 2.5rem;
      font-weight: 800;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .data-table th,
    .data-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      margin-right: 0.5rem;
    }

    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge-status {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .pending {
      background: oklch(60% 0.15 60 / 0.2);
      color: oklch(80% 0.1 60);
    }

    .verified {
      background: oklch(70% 0.15 150 / 0.2);
      color: oklch(85% 0.1 150);
    }
  </style>
</head>

<body>
  <div class="aurora-bg"></div>

  <!-- Admin Login -->
  <div id="loginOverlay" class="login-overlay">
    <div class="glass-card" style="width: 400px; text-align: center">
      <h2 class="gradient-text">Admin Login</h2>
      <input type="password" id="adminPass" placeholder="Enter System Password" style="margin: 1.5rem 0">
      <button class="btn btn-primary" style="width: 100%" onclick="checkPass()">Access Dashboard</button>
      <p id="loginError" style="color: oklch(70% 0.15 20); margin-top: 1rem; display: none">Access Denied</p>
    </div>
  </div>

  <nav class="navbar">
    <div class="nav-brand">Admin Control Center</div>
    <div class="nav-links">
      <button class="btn glass-card" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="container">
    <div class="admin-stats">
      <div class="glass-card" data-reveal>
        <div style="font-size: 0.8rem; opacity: 0.7">Total Donors</div>
        <div class="stat-val gradient-text" id="statDonors">0</div>
      </div>
      <div class="glass-card" data-reveal>
        <div style="font-size: 0.8rem; opacity: 0.7">Pending Approvals</div>
        <div class="stat-val gradient-text" id="statPending">0</div>
      </div>
      <div class="glass-card" data-reveal>
        <div style="font-size: 0.8rem; opacity: 0.7">Verified NGOs</div>
        <div class="stat-val gradient-text" id="statNGOs">0</div>
      </div>
    </div>

    <div class="glass-card">
      <div class="tab-nav" style="margin-bottom: 1rem">
        <button class="btn btn-primary tab-btn" onclick="showTab('donors')">Donors</button>
        <button class="btn glass-card tab-btn" onclick="showTab('receivers')">Receivers</button>
        <button class="btn glass-card tab-btn" onclick="showTab('delivery')">Delivery</button>
      </div>

      <div id="tableContainer">
        <table class="data-table">
          <thead>
            <tr id="tableHead"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let currentTab = 'donors';

    function checkPass() {
      if (document.getElementById('adminPass').value === 'admin123') {
        document.getElementById('loginOverlay').style.display = 'none';
        fetchData();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function logout() { location.reload(); }

    async function fetchData() {
      let endpoint = '/admin/restaurants';
      if (currentTab === 'receivers') endpoint = '/admin/acceptors';
      if (currentTab === 'delivery') endpoint = '/admin/deliveries';

      const res = await fetch(endpoint);
      const data = await res.json();
      renderTable(data);

      // Update stats
      if (currentTab === 'donors') {
        document.getElementById('statDonors').textContent = data.length;
        document.getElementById('statPending').textContent = data.filter(d => !d.isVerified).length;
      }
    }

    function renderTable(data) {
      const body = document.getElementById('tableBody');
      const head = document.getElementById('tableHead');

      if (currentTab === 'donors') {
        head.innerHTML = `<th>Name</th><th>Location</th><th>Item</th><th>Status</th><th>Actions</th>`;
        body.innerHTML = data.map(d => `
                <tr>
                    <td>${d.name}</td>
                    <td>${d.location}</td>
                    <td>${d.items && d.items[0] ? d.items[0].food : 'N/A'}</td>
                    <td><span class="badge-status ${d.isVerified ? 'verified' : 'pending'}">${d.isVerified ? 'Verified' : 'Pending'}</span></td>
                    <td>
                        ${!d.isVerified ? `<button class="btn btn-primary" style="padding: 4px 10px; font-size: 0.7rem;" onclick="verifyItem('${d._id}', 'restaurant')">Approve</button>` : ''}
                        <button class="glass-card" style="padding: 4px 10px; font-size: 0.7rem;" onclick="deleteItem('${d._id}', 'restaurant')">Delete</button>
                    </td>
                </tr>
            `).join('');
      } else if (currentTab === 'receivers') {
        head.innerHTML = `<th>Name</th><th>Location</th><th>Needs</th><th>Status</th><th>Actions</th>`;
        body.innerHTML = data.map(d => `
                <tr>
                    <td>${d.name}</td>
                    <td>${d.location}</td>
                    <td>${d.needs || 'Regular'}</td>
                    <td><span class="badge-status ${d.isVerified ? 'verified' : 'pending'}">${d.isVerified ? 'Verified' : 'Pending'}</span></td>
                    <td>
                        ${!d.isVerified ? `<button class="btn btn-primary" style="padding: 4px 10px; font-size: 0.7rem;" onclick="verifyItem('${d._id}', 'acceptor')">Approve</button>` : ''}
                        <button class="glass-card" style="padding: 4px 10px; font-size: 0.7rem;" onclick="deleteItem('${d._id}', 'acceptor')">Delete</button>
                    </td>
                </tr>
            `).join('');
      } else {
        head.innerHTML = `<th>Name</th><th>Area</th><th>Vehicle</th><th>Actions</th>`;
        body.innerHTML = data.map(d => `
                <tr>
                    <td>${d.name}</td>
                    <td>${d.location}</td>
                    <td>${d.vehicleType}</td>
                    <td>
                        <button class="glass-card" style="padding: 4px 10px; font-size: 0.7rem;" onclick="deleteItem('${d._id}', 'delivery')">Remove</button>
                    </td>
                </tr>
            `).join('');
      }
    }

    async function verifyItem(id, type) {
      const route = type === 'restaurant' ? `/verify-restaurant/${id}` : `/verify-acceptor/${id}`;
      await fetch(route, { method: 'PUT' });
      fetchData();
    }

    async function deleteItem(id, type) {
      if (confirm("Confirm deletion?")) {
        let route = `/delete-restaurant/${id}`;
        if (type === 'acceptor') route = `/delete-acceptor/${id}`;
        if (type === 'delivery') route = `/delete-delivery/${id}`;
        await fetch(route, { method: 'DELETE' });
        fetchData();
      }
    }

    function showTab(t) {
      currentTab = t;
      fetchData();
    }
  </script>
</body>

</html>
